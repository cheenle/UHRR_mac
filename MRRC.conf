# PTT 绝对最大发射时长（秒）。发射持续超过此值，服务端 PTTSafetyMonitor
# 强制收回 PTT，与客户端/音频流/浏览器状态无关。防止远程发射卡死。
ptt_tot_seconds = 120

[AUDIO]
outputdevice = USB Audio CODEC 
inputdevice = USB Audio CODEC 

[HAMLIB]
rig_pathname = /dev/cu.usbserial-230
retry = 5
rig_model = IC_M710
trxautopower = True
rig_rate = 4800
data_bits = 
stop_bits = 2
serial_parity = 
serial_handshake = 
dtr_state = 
rts_state = 

[RNNOISE]
# RNNoise 神经网络降噪（RX 接收端）
# 注意: 已弃用，推荐使用 WDSP 的 NR2 频谱降噪
# 需要安装: pip install pyrnnoise
enabled = False
# 降噪强度 0-100，0=仅降噪不静音，100=无语音时静音
suppress_level = 50

[WDSP]
# WDSP 数字信号处理（Warren Pratt's DSP Library）
# 编译安装: https://github.com/g0orx/wdsp
enabled = True
# 48kHz: EMNR(4096点FFT)用粗bin, 噪声估计平滑, 避免16k时的"水音"音乐噪声
sample_rate = 48000
buffer_size = 256

# 降噪级别: 0=关, 1=极温和, 2=温和(推荐), 3=中等, 4=强力
nr2_level = 2
# AE 掩码平滑（抑制 NR2 频谱减法"水音"/音乐噪声）
# psi: 平滑宽度系数（越大越平滑, WDSP默认10, 推荐20）
# zeta_thresh: 触发阈值（越小越常触发, WDSP默认0.75, 推荐0.5）
nr2_ae_psi = 20.0
nr2_ae_zeta_thresh = 0.50

# ── NR2 语气保真度 / 增益级（V6.0.1）─────────────────────────────
# NR2 每 bin 最大衰减(dB)：EMNR 会把语音自身当噪声（实测单音 mask=0.022），
# 限制每 bin 衰减可直接消除"声音变形过度"。默认跟随 nr2_level 等级表：
#   level 1/2/3/4 = -6 / -12 / -16 / -20 dB。
# 取消下面注释即"钉死"该上限（不再跟随等级）：-6 极保真 / -12 推荐 / -20 强降噪；0=不限制(旧行为)
#nr2_max_atten_db = -12
# NR2 干湿混合(0~1)：>0 时 mask' = dry+(1-dry)*mask，比硬下限更平滑
nr2_dry = 0.0
# AGC 最大补偿增益(dB)：限制"EMNR 砍完再被 AGC 狂补"的增益级（旧行为约 +80）
agc_top_db = 20
# 输出电势 panel：AGC 输出(~0.98) × 此值。旧值 0.06（-24dBFS）；
# 0.35 约 -9dBFS，信噪比/Opus 更友好——音量会明显变大，如需保持旧音量可调回 0.06
panel_gain = 0.35

# 噪声抑制器（脉冲干扰: 电器火花、雷电等）
nb_enabled = True

# 自动陷波器（CW 干扰音）
anf_enabled = False

# AGC 模式: 0=关, 1=长, 2=慢, 3=中(推荐), 4=快
agc_mode = 3

# 带通滤波器 (Hz) - SSB 语音核心频段
bandpass_low = 300.0
bandpass_high = 2700.0

# ===== 音频均衡器（TX发射端） =====
# 启用 TX EQ
tx_eq_enabled = False
# 低频增益 (dB, -12 到 12)
tx_eq_low = 4.0
# 中频增益 (dB)
tx_eq_mid = 6.0
# 高频增益 (dB)
tx_eq_high = -3.0

# ===== RagChew TX 配置（本地强信号，浏览器端 Web Audio API 实现） =====
# EQ: 低切150Hz | 500Hz -2dB | 2.4kHz +3dB | 高切3kHz
# Compressor: Ratio 3:1, 温和压缩
# Noise Gate: 静音背景
ragchew_tx_eq_low_cut = 150
ragchew_tx_mid_cut_freq = 500
ragchew_tx_mid_cut_gain = -2
ragchew_tx_presence_freq = 2400
ragchew_tx_presence_gain = 3
ragchew_tx_high_cut = 3000
ragchew_tx_compressor_ratio = 3

[PANADAPTER]
sample_rate = 960000
center_freq = 68330000
freq_correction = 1
gain = 10
fft_window = hamming

[ATR1000]
; ATR-1000 功率/SWR 表 + 天调是**可选**设备。没接它的部署请设为 false：
; 否则日志里会持续出现“代理连接失败/重连/看守拉起”。
;   auto  = 配了 instance_atr1000_device 才启用（默认）
;   true  = 总是启用
;   false = 完全关闭（不连代理、不拉进程、不轮询；启动只留一行说明）
; 也可用环境变量 MRRC_ATR1000=0/1 临时覆盖。
enabled = auto
