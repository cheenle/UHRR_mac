<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 768" role="img" aria-labelledby="title desc">
  <title id="title">BG1SB HAM Radio workstation</title>
  <desc id="desc">Vector SVG hero illustration of the BG1SB HAM radio workstation with radio stack, screen, microphone and station highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b12"/><stop offset="1" stop-color="#17100a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd58a"/><stop offset="1" stop-color="#f0a030"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12345a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1152" height="768" fill="url(#bg)"/>
