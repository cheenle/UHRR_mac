    <g fill="#f4bd65" font-size="26" text-anchor="middle"><text x="28" y="27">▣</text><text x="28" y="105">⌁</text><text x="28" y="183">◉</text><text x="28" y="261">⌁</text><text x="28" y="339">✓</text></g>
    <g font-size="17" font-weight="700" fill="#ffd58a"><text x="66" y="8">专业设备</text><text x="66" y="86">高效工作流</text><text x="66" y="164">优质音频</text><text x="66" y="242">全面覆盖</text><text x="66" y="320">精心搭建</text></g>
