  </g>
  <g transform="translate(24 430)">
    <rect width="1104" height="180" rx="10" class="layer" stroke="#a78bfa"/><text x="12" y="20" fill="#a78bfa" font-size="10" font-weight="700">LAYER 3: CONTROL - Radio · Audio · DSP · Voice AI</text>
    <g transform="translate(20 46)"><rect width="170" height="54" class="node" stroke="#22d3ee"/><text x="85" y="24" text-anchor="middle" class="nt">Radio Control</text><text x="85" y="42" text-anchor="middle" class="nd">Hamlib wrapper</text></g>
    <g transform="translate(220 46)"><rect width="170" height="54" class="node" stroke="#a78bfa"/><text x="85" y="24" text-anchor="middle" class="nt">Audio Pipeline</text><text x="85" y="42" text-anchor="middle" class="nd">Opus / Int16</text></g>
    <g transform="translate(420 46)"><rect width="170" height="54" class="node" stroke="#f59e0b"/><text x="85" y="24" text-anchor="middle" class="nt">WDSP</text><text x="85" y="42" text-anchor="middle" class="nd">NR2 / NB / AGC</text></g>
    <g transform="translate(620 46)"><rect width="170" height="54" class="node" stroke="#f59e0b"/><text x="85" y="24" text-anchor="middle" class="nt">ATR Proxy</text><text x="85" y="42" text-anchor="middle" class="nd">Learning buffer</text></g>
    <g transform="translate(820 46)"><rect width="170" height="54" class="node" stroke="#a78bfa"/><text x="85" y="24" text-anchor="middle" class="nt">Voice / FT8</text><text x="85" y="42" text-anchor="middle" class="nd">ASR · TTS · DXCC</text></g>
    <path d="M147 100V142" class="flow" stroke="#22d3ee"/><path d="M305 100V142" class="flow" stroke="#a78bfa"/><path d="M505 100V142" class="flow" stroke="#f59e0b"/>
