  <g transform="translate(24 624)">
    <rect width="1104" height="104" rx="10" class="layer" stroke="#f59e0b"/><text x="12" y="20" fill="#f59e0b" font-size="10" font-weight="700">LAYER 4: DEVICE - Radio Hardware · Antenna Tuner · Audio Interface</text>
    <g transform="translate(20 36)"><rect width="164" height="46" class="node" stroke="#f59e0b"/><text x="82" y="28" text-anchor="middle" class="nt">IC-M710</text></g>
    <g transform="translate(220 36)"><rect width="164" height="46" class="node" stroke="#f59e0b"/><text x="82" y="28" text-anchor="middle" class="nt">Audio CODEC</text></g>
    <g transform="translate(420 36)"><rect width="164" height="46" class="node" stroke="#f59e0b"/><text x="82" y="28" text-anchor="middle" class="nt">ATR-1000</text></g>
    <g transform="translate(620 36)"><rect width="164" height="46" class="node" stroke="#64748b"/><text x="82" y="28" text-anchor="middle" class="nt">JTDX / WSJT-X</text></g>
  </g>
</svg>
