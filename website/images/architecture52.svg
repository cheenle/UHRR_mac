    <rect x="210" y="36" width="350" height="60" class="node" stroke="#34d399"/><text x="385" y="60" text-anchor="middle" class="nt">MRRC Main Server</text><text x="385" y="80" text-anchor="middle" class="nd">Python 3.12+ · Tornado Async I/O · :8877</text>
    <rect x="52" y="126" width="190" height="46" class="node" stroke="#f59e0b"/><text x="147" y="153" text-anchor="middle" class="nt">/WSCTRX</text>
    <rect x="292" y="126" width="190" height="46" class="node" stroke="#f59e0b"/><text x="387" y="153" text-anchor="middle" class="nt">/WSATR1000</text>
    <rect x="532" y="126" width="158" height="46" class="node" stroke="#f59e0b"/><text x="611" y="153" text-anchor="middle" class="nt">/WSCW</text>
