<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 768" role="img" aria-labelledby="title desc">
  <title id="title">MRRC V5 architecture</title>
  <desc id="desc">Vector SVG architecture diagram for MRRC V5 showing client, service, control and device layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050817"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/></marker>
    <style>text{font-family:JetBrains Mono,Consolas,monospace}.title{fill:#f8fafc;font-size:28px;font-weight:800}.sub{fill:#94a3b8;font-size:12px}.layer{fill:none;stroke-dasharray:6 5;stroke-width:1.5}.node{rx:8;fill:#0b1526;stroke-width:2}.nt{fill:#e2e8f0;font-size:13px;font-weight:700}.nd{fill:#94a3b8;font-size:9px}.flow{fill:none;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1152" height="768" fill="url(#bg)"/>
  <path d="M0 98H1152M0 126H1152M0 154H1152M0 182H1152M0 210H1152M0 238H1152M0 266H1152M0 294H1152M0 322H1152M0 350H1152M0 378H1152M0 406H1152M0 434H1152M0 462H1152M0 490H1152M0 518H1152M0 546H1152M0 574H1152M0 602H1152M0 630H1152M0 658H1152M0 686H1152M0 714H1152M28 80V740M56 80V740M84 80V740M112 80V740M140 80V740M168 80V740M196 80V740M224 80V740M252 80V740M280 80V740M308 80V740M336 80V740M364 80V740M392 80V740M420 80V740M448 80V740M476 80V740M504 80V740M532 80V740M560 80V740M588 80V740M616 80V740M644 80V740M672 80V740M700 80V740M728 80V740M756 80V740M784 80V740M812 80V740M840 80V740M868 80V740M896 80V740M924 80V740M952 80V740M980 80V740M1008 80V740M1036 80V740M1064 80V740M1092 80V740M1120 80V740" stroke="#142033" stroke-width="1" opacity=".65"/>
  <text x="16" y="33" class="title">MRRC V5.0 Architecture</text>
  <text x="16" y="58" class="sub">SDD-MRR-2026-001 · IBM TeamSD v2.3.2 · Mobile Remote Radio Control · BG1SB/ON80</text>
  <g transform="translate(24 132)">
    <rect width="1104" height="104" rx="10" class="layer" stroke="#22d3ee"/><text x="12" y="20" fill="#22d3ee" font-size="10" font-weight="700">LAYER 1: CLIENT - Browser / Mobile / External Applications</text>
    <g transform="translate(12 28)"><rect width="126" height="52" class="node" stroke="#22d3ee"/><text x="63" y="21" text-anchor="middle" class="nt">Mobile V5.0</text><text x="63" y="39" text-anchor="middle" class="nd">mobile_modern.html</text></g>
    <g transform="translate(196 28)"><rect width="126" height="52" class="node" stroke="#22d3ee"/><text x="63" y="21" text-anchor="middle" class="nt">Desktop UI</text><text x="63" y="39" text-anchor="middle" class="nd">modern / index</text></g>
    <g transform="translate(380 28)"><rect width="126" height="52" class="node" stroke="#22d3ee"/><text x="63" y="21" text-anchor="middle" class="nt">CW Decoder</text><text x="63" y="39" text-anchor="middle" class="nd">ONNX Runtime</text></g>
    <g transform="translate(580 28)"><rect width="126" height="52" class="node" stroke="#22d3ee"/><text x="63" y="21" text-anchor="middle" class="nt">FT8 Web</text><text x="63" y="39" text-anchor="middle" class="nd">JTDX bridge</text></g>
  </g>
  <g transform="translate(24 248)">
