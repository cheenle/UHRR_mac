# 实例可达的其它名字（逗号分隔）：写进 Cloud Hub 证书的 SAN（F8）。
# 用途：radio.vlsc.net 直连本机 IPv6 的老书签，证书只带
# bg6lh-legacy.mrrc.vlsc.net 时浏览器会因域名不匹配拒绝（2026-10-04 实测）。
#
# 换证书/改 SAN 是**站端 + hub 两侧一起动**（2026-10-04 实测完整流程，已跑通）：
#   ① 站端重签（可带本行配置的额外 SAN）+ 向 hub 重新登记（/enroll，用 portal 的
#      enroll_secret）—— 只重签不登记 = hub 入口 502；
#   ② hub：sudo /usr/local/sbin/gen_hub_routes.py && sudo nginx -t &&
#      sudo systemctl reload nginx（生成器重建 trust-bundle.pem = 系统 CA + 在册实例证书，
#      nginx 用 proxy_ssl_verify + 该 bundle + $mrrc_tls_name 校验上游）；
#   ③ 站端重启（TLS 上下文只在启动时建立）。把 ② 插在 ③ 的重启窗口里，对外中断≈一次重启。
cert_extra_names = radio.vlsc.net

[CTRL]
interval_smeter_update = 5.0
debug = True

[AUDIO]
outputdevice = USB Audio CODEC
inputdevice = USB Audio CODEC

[HAMLIB]
rig_pathname = /dev/cu.usbserial-140
retry = 5
rig_model = IC-M710
trxautopower = True
rig_rate = 4800
data_bits = 
stop_bits = 2
serial_parity = 
serial_handshake = 
dtr_state = 
rts_state = 

# rigctld 可执行文件（可选，F12）：IC-M710 的官方 hamlib 后端 get_mode() 恒为空
# （set_mode 从不记 priv->mode），模式只能在 1 秒的 get 缓存内读到；S 表（RAWSTR）
# 也只声明未实现。这里指向本机打过补丁的 rigctld（补丁：set_mode 记下 priv->mode，
# 与 set_freq 记 rxfreq 对称），于是 RUMlogNG 能正常读到频率与模式。
# 空 = 用 PATH 里的 rigctld；构建方式与补丁内容见 CHANGELOG / RC-003。
rigctld_bin = /usr/local/mrrc-hamlib/bin/rigctld

[RNNOISE]
enabled = False
suppress_level = 50

[WDSP]
enabled = True
sample_rate = 48000
buffer_size = 256
# 2026-10-04：本机 AF 增益同时驱动"本地喇叭"和"采集电平"（实测耦合 ~15 dB）。
# 为让喇叭舒服又把手机端响度补回来，AF 取小值（0.1）+ 这里把 DSP 输入增益拉到 1.0（+9 dB，
# 只影响数字侧，不影响喇叭；给 AGC 喂足信号）。剩余 ~6 dB 由页面"接收音量"滑块补。
panel_gain = 1.0
nr2_level = 2
nr3 = plus
nr2_ae_psi = 20.0
nr2_ae_zeta_thresh = 0.50
nb_enabled = False
anf_enabled = False
agc_mode = 3
bandpass_low = 300.0
bandpass_high = 2700.0
tx_eq_enabled = False
tx_eq_low = 4.0
tx_eq_mid = 6.0
tx_eq_high = -3.0
ragchew_tx_eq_low_cut = 150
ragchew_tx_mid_cut_freq = 500
ragchew_tx_mid_cut_gain = -2
ragchew_tx_presence_freq = 2400
ragchew_tx_presence_gain = 3
ragchew_tx_high_cut = 3000
ragchew_tx_compressor_ratio = 3

[PANADAPTER]
sample_rate = 960000
center_freq = 68330000
freq_correction = 1
gain = 10
fft_window = hamming

[INSTANCE_SETTINGS]
instance_name = radio1
instance_port = 8891
instance_rigctl_device = /dev/cu.usbserial-140
instance_rigctl_model = 30003
instance_rigctl_speed = 4800
instance_rigctl_stop_bits = 2
instance_rigctl_host = 127.0.0.1
instance_rigctl_port = 4531
instance_audio_input = USB PnP Sound Device: Audio (hw:3,0)
instance_audio_output = USB PnP Sound Device: Audio (hw:3,0)
instance_atr1000_device = 192.168.1.63
instance_atr1000_port = 60001
instance_log_dir = .
instance_unix_socket = /tmp/mrrc_radio1.sock

